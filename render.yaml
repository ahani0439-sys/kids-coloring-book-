# Render Blueprint for Dino Book Factory.
# Applying it creates ONE web service on Render's FREE plan ($0). Nothing paid is enabled.
# Storage: the free plan has no persistent disk, so uploads, approvals and PDFs are saved to a
# Cloudflare R2 bucket (free tier: 10 GB) via the S3_* variables below. See README.md.
#
# Paid alternative (only if you approve the cost): change `plan: free` to `plan: starter` ($7/month),
# set STORAGE_BACKEND to "local", and uncomment the disk block ($0.25 per GB per month).
services:
  - type: web
    name: dino-book-factory
    runtime: node
    plan: free
    branch: claude/storyforge-mobile-app-62wmq5
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    # disk:
    #   name: book-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD          # required: the app will not start without it
        sync: false
      - key: IMAGE_PROVIDER        # "replicate" or "openai"
        value: replicate
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY        # only if IMAGE_PROVIDER=openai
        sync: false
      - key: MAX_GENERATIONS_PER_DAY
        value: "60"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT           # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET
        value: dino-book-factory
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
