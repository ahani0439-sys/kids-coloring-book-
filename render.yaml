# Render Blueprint for Dino Book Factory.
# Applying it creates ONE web service on Render's FREE plan ($0). Nothing paid is enabled.
# Manual uploads need no image API. The built-in drawing engine (IMAGE_PROVIDER=svg) needs no key.
#
# Storage: the free plan has no persistent disk (files vanish on every restart), so uploads,
# approvals and PDFs are saved to an S3-compatible bucket. Recommended free option:
#   Backblaze B2 (10 GB free, no card at sign-up):
#     S3_ENDPOINT = https://s3.<region>.backblazeb2.com   e.g. https://s3.us-east-005.backblazeb2.com
#     S3_REGION   = <region>                               e.g. us-east-005
#   Cloudflare R2 (10 GB free; Cloudflare may ask for a payment method):
#     S3_ENDPOINT = https://<ACCOUNT_ID>.r2.cloudflarestorage.com   S3_REGION = auto
# The app refuses to start in production if these are missing, rather than losing your work.
#
# Paid alternative (only with your approval): plan: starter ($7/month) + a disk ($0.25/GB/month),
# STORAGE_BACKEND=local and LOCAL_DISK_IS_PERSISTENT=true.
services:
  - type: web
    name: dino-book-factory
    runtime: node
    plan: free
    branch: claude/storyforge-mobile-app-62wmq5
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    # disk:
    #   name: book-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR              # working copy only; the bucket is the permanent copy
        value: /tmp/dino-book-data
      - key: APP_PASSWORD          # required: the app will not start without it
        sync: false
      # Image generation uses the free built-in drawing engine by default (no key needed).
      # Optional paid providers: set IMAGE_PROVIDER to "replicate" or "openai" and add its key.
      - key: IMAGE_PROVIDER
        value: svg
      - key: MAX_GENERATIONS_PER_DAY
        value: "60"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT           # see the comment at the top
        sync: false
      - key: S3_REGION             # B2: e.g. us-east-005 · R2: auto
        sync: false
      - key: S3_BUCKET             # your bucket's exact name (B2 names are globally unique)
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
